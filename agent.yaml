spec_version: "0.1.0"
name: "b2b-contract-indemnity-risk-auditor"
version: "1.0.0"
category: "legal"
author: "Rucha Salpure"
description: "Parses Master Service Agreements (MSAs) to detect uncapped liability clauses, non-mutual indemnification terms, and consequential damage waivers"
capabilities:
  - "indemnity-clause-risk-scoring"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "indemnity-clause-risk-scoring"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
